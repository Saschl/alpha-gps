name: Build iOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Test signing and upload configuration
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Prepare App Store Connect credentials
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          : "${APP_STORE_CONNECT_KEY_ID:?Set the APP_STORE_CONNECT_KEY_ID secret}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?Set the APP_STORE_CONNECT_ISSUER_ID secret}"
          : "${APP_STORE_CONNECT_PRIVATE_KEY_BASE64:?Set the APP_STORE_CONNECT_PRIVATE_KEY_BASE64 secret}"
          umask 077
          mkdir -p "$RUNNER_TEMP/app-store-connect"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/app-store-connect/AuthKey.p8"
          openssl pkey -in "$RUNNER_TEMP/app-store-connect/AuthKey.p8" -noout

      - name: Install signing assets
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          : "${IOS_CERTIFICATE_BASE64:?Set the IOS_CERTIFICATE_BASE64 secret}"
          : "${IOS_CERTIFICATE_PASSWORD:?Set the IOS_CERTIFICATE_PASSWORD secret}"
          : "${IOS_PROVISIONING_PROFILE_BASE64:?Set the IOS_PROVISIONING_PROFILE_BASE64 secret}"
          umask 077
          signing_dir="$RUNNER_TEMP/ios-signing"
          keychain="$RUNNER_TEMP/ios-signing.keychain-db"
          mkdir -p "$signing_dir"
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$signing_dir/distribution.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$signing_dir/profile.mobileprovision"
          security cms -D -i "$signing_dir/profile.mobileprovision" > "$signing_dir/profile.plist"

          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_dir/distribution.p12" -P "$IOS_CERTIFICATE_PASSWORD" \
            -k "$keychain" -t cert -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" > "$signing_dir/identities.txt"
          python3 .github/scripts/ios_signing.py \
            --profile "$signing_dir/profile.plist" \
            --identities "$signing_dir/identities.txt" \
            --entitlements iosApp/alphagps/alphagps.entitlements \
            --bundle-id com.saschl.cameragps \
            --export-options "$signing_dir/ExportOptions.plist" \
            --upload-options "$signing_dir/UploadOptions.plist" \
            --github-env "$GITHUB_ENV"
          profiles_dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles_dir"
          cp "$signing_dir/profile.mobileprovision" \
            "$profiles_dir/AlphaGPS-CI-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.mobileprovision"
          rm "$signing_dir/distribution.p12"

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '25'
          distribution: temurin

      - name: Cache Gradle and Kotlin Native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-ios-xcode-27.0-${{ hashFiles('**/*.gradle.kts', 'gradle/*.toml', 'gradle/*.properties', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties', '**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ios-xcode-27.0-

      - name: Check build tools
        run: |
          mkdir -p "$RUNNER_TEMP/ios-build"
          echo "IOS_BUILD_DIR=$RUNNER_TEMP/ios-build" >> "$GITHUB_ENV"
          echo "SPM_DIR=$RUNNER_TEMP/ios-packages" >> "$GITHUB_ENV"
          xcodebuild -version
          java -version
          test -d "$ANDROID_HOME"

      - name: Resolve pinned Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project iosApp/alphagps.xcodeproj \
            -scheme alphagps \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -onlyUsePackageVersionsFromResolvedFile \
            2>&1 | tee "$IOS_BUILD_DIR/packages.log"

      - name: Configure Sentry Cocoa linking
        run: |
          sentry_framework="$SPM_DIR/artifacts/sentry-cocoa/Sentry-Dynamic/Sentry-Dynamic.xcframework"
          test -d "$sentry_framework"
          mkdir -p "$HOME/.gradle"
          printf '\nsentry.cocoa.frameworkPath=%s\n' "$sentry_framework" >> "$HOME/.gradle/gradle.properties"

      - name: Archive signed iOS app
        run: |
          xcodebuild archive \
            -project iosApp/alphagps.xcodeproj \
            -scheme alphagps \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$IOS_BUILD_DIR/DerivedData" \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -archivePath "$IOS_BUILD_DIR/AlphaGPS.xcarchive" \
            -resultBundlePath "$IOS_BUILD_DIR/Archive.xcresult" \
            ARCHS=arm64 \
            CODE_SIGN_STYLE=Manual \
            "DEVELOPMENT_TEAM=$IOS_TEAM_ID" \
            "CODE_SIGN_IDENTITY=$IOS_SIGNING_IDENTITY" \
            "PROVISIONING_PROFILE_SPECIFIER=$IOS_PROFILE_UUID" \
            2>&1 | tee "$IOS_BUILD_DIR/archive.log"

      - name: Export App Store IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$IOS_BUILD_DIR/AlphaGPS.xcarchive" \
            -exportPath "$IOS_BUILD_DIR/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ios-signing/ExportOptions.plist" \
            2>&1 | tee "$IOS_BUILD_DIR/export.log"
          test -f "$IOS_BUILD_DIR/export/alphagps.ipa"

      - name: Package archive
        run: |
          test -d "$IOS_BUILD_DIR/AlphaGPS.xcarchive/Products/Applications/alphagps.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$IOS_BUILD_DIR/AlphaGPS.xcarchive" "$IOS_BUILD_DIR/AlphaGPS.xcarchive.zip"

      - name: Upload signed archive and IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-signed-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.IOS_BUILD_DIR }}/AlphaGPS.xcarchive.zip
            ${{ env.IOS_BUILD_DIR }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$IOS_BUILD_DIR/AlphaGPS.xcarchive" \
            -exportPath "$IOS_BUILD_DIR/upload" \
            -exportOptionsPlist "$RUNNER_TEMP/ios-signing/UploadOptions.plist" \
            -authenticationKeyPath "$RUNNER_TEMP/app-store-connect/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            -allowProvisioningUpdates \
            2>&1 | tee "$IOS_BUILD_DIR/upload.log"
          echo 'Upload accepted. Check App Store Connect → TestFlight for processing and the assigned build number.' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing and upload credentials
        if: ${{ always() }}
        run: |
          keychain="$RUNNER_TEMP/ios-signing.keychain-db"
          cleanup_status=0
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain" || cleanup_status=$?
          fi
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/AlphaGPS-CI-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.mobileprovision"
          rm -rf "$RUNNER_TEMP/ios-signing"
          rm -rf "$RUNNER_TEMP/app-store-connect"
          exit "$cleanup_status"

      - name: Upload build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-build/*.log
            ${{ runner.temp }}/ios-build/Archive.xcresult
            ${{ runner.temp }}/ios-build/upload/DistributionSummary.plist
          if-no-files-found: warn
          retention-days: 14
